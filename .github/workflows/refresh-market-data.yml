name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and validate market data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node scripts/refresh-market-data.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No market-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Refresh market data"
          git push
